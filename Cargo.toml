[package]
name = "miniac"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
rtc-dtls = "0.21"
rtc-shared = { version = "0.21", default-features = false }
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["std"] }
rsa = { version = "0.9", features = ["sha1", "sha2"] }
sha1 = "0.10"
sha2 = "0.10"
pem = "3"
x509-parser = "0.16"
async-trait = "0.1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time", "local-time"] }
dashmap = "6.1.0"
once_cell = "1.21"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Local forks of rtc-dtls / rtc-crypto adding static-RSA AES-128-CBC (TLS_RSA_WITH_AES_128_CBC_SHA, 0x002f).
[patch.crates-io]
rtc-dtls = { path = "vendor/rtc-dtls" }
rtc-crypto = { path = "vendor/rtc-crypto" }
