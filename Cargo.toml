[package]
name = "miniac"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
rtc-dtls = "0.21"
# Pinned to the forked workspace version (https://github.com/lark/rtc):
# rtc-dtls exposes rtc-shared types, so both must resolve to the same instance.
rtc-shared = { version = "=0.21.0", default-features = false }
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["std"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
sha1 = "0.11"
sha2 = "0.11"
pem = "4"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time", "local-time", "env-filter"] }
dashmap = "6.1.0"
once_cell = "1.21"
rusqlite = { version = "0.41", features = ["bundled"] }
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.11"
rand = "0.10"
libc = "0.2"
socket2 = "0.6"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Optimize the shipped binary for size rather than compile speed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Fork of the rtc workspace (https://github.com/lark/rtc) adding DTLS 1.0 and
# static-RSA AES-128/256-CBC suites.
[patch.crates-io]
rtc-dtls = { git = "https://github.com/lark/rtc.git", rev = "db3d858d2e29dad845da1f8ba079eb60076b3f5a" }
rtc-crypto = { git = "https://github.com/lark/rtc.git", rev = "db3d858d2e29dad845da1f8ba079eb60076b3f5a" }
rtc-shared = { git = "https://github.com/lark/rtc.git", rev = "db3d858d2e29dad845da1f8ba079eb60076b3f5a" }
